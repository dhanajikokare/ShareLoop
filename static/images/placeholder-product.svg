<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18A999" />
      <stop offset="100%" stop-color="#14213D" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18A999" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#14213D" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Subtle Decorative Circles -->
  <circle cx="200" cy="130" r="90" fill="url(#circleGrad)" />
  <circle cx="200" cy="130" r="65" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Central Product Silhouette Icon -->
  <g transform="translate(160, 90)" fill="url(#iconGrad)">
    <!-- Box / Package Silhouette -->
    <path d="M40 0 L75 18 L75 58 L40 76 L5 58 L5 18 Z" opacity="0.15" />
    <path d="M40 8 L68 22 L40 36 L12 22 Z" fill="#18A999" />
    <path d="M12 26 L38 39 L38 70 L12 56 Z" fill="#14213D" opacity="0.8" />
    <path d="M42 39 L68 26 L68 56 L42 70 Z" fill="#14213D" opacity="0.95" />
    <!-- Loop / Share Arrows Emblem -->
    <path d="M40 16 L46 22 L34 22 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="40" cy="46" r="8" fill="#18A999" />
    <path d="M37 46 L43 43 L43 49 Z" fill="#FFFFFF" />
  </g>

  <!-- Branding & Fallback Label -->
  <text x="200" y="215" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#14213D" text-anchor="middle" letter-spacing="0.5">ShareLoop Marketplace</text>
  <text x="200" y="235" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Community Shared Item &middot; Pune</text>
</svg>
